# Vendored crates.io librespot-audio 0.8.0; upstream MIT license: ../LICENSE.
# Renderer patches in src/fetch/mod.rs: per-load song-only persistent cache,
# and the audio size bound, which announces every file it prunes.

[package]
edition = "2024"
rust-version = "1.85"
name = "librespot-audio"
version = "0.8.0"
authors = ["Paul Lietar <paul@lietar.net>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The audio fetching logic for librespot"
readme = false
license = "MIT"
repository = "https://github.com/librespot-org/librespot"

[features]
default = ["native-tls"]
native-tls = ["librespot-core/native-tls"]
rustls-tls-native-roots = ["librespot-core/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["librespot-core/rustls-tls-webpki-roots"]

[lib]
name = "librespot_audio"
path = "src/lib.rs"

[dependencies.aes]
version = "0.8"

[dependencies.bytes]
version = "1"

[dependencies.ctr]
version = "0.9"

[dependencies.futures-util]
version = "0.3"
features = ["std"]
default-features = false

[dependencies.http-body-util]
version = "0.1"

[dependencies.hyper]
version = "1.6"
features = [
    "http1",
    "http2",
]

[dependencies.hyper-util]
version = "0.1"
features = [
    "client",
    "http2",
]

[dependencies.librespot-core]
version = "0.8.0"
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.tempfile]
version = "3"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "macros",
    "sync",
]
