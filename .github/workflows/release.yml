name: Signed desktop release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bun -e 'const v = require("./package.json").version; const tag = process.env.RELEASE_TAG.replace(/^v/, ""); if (v !== tag || require("./src-tauri/tauri.conf.json").version !== tag) throw Error(`Release tag ${tag} must match app version ${v}`)'
      - name: Test frontend, engine and shell
        # The shell compiles against the built frontend and bundles the
        # release engine, so both must exist before its tests build.
        run: |
          bun test
          bun run build
          bun run build:engine
          cargo test -p renderer-engine
          cargo test -p spotifine
      - name: Build and sign macOS app and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          bun tauri build
          app=target/release/bundle/macos/Spotifine.app
          test -x "$app/Contents/MacOS/Spotifine"
          test -x "$app/Contents/Resources/PlaybackEngine"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.spotifine.client
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 14.0
          archive="$app.tar.gz"
          test -s "$archive"
          test -s "$archive.sig"
          mkdir -p archive-check
          tar -xzf "$archive" -C archive-check
          codesign --verify --deep --strict archive-check/Spotifine.app
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$app" release-assets/Spotifine-macos-arm64.zip
          cp "$archive" release-assets/Spotifine-macos-arm64.app.tar.gz
          cp "$archive.sig" release-assets/Spotifine-macos-arm64.app.tar.gz.sig
      - name: Smoke-launch the app and bundled engine
        shell: bash
        run: |
          set -euo pipefail
          app=target/release/bundle/macos/Spotifine.app
          log="$HOME/Library/Application Support/Spotifine/logs/spotifine.log"
          "$app/Contents/MacOS/Spotifine" > runner-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if test -f "$log" && grep -q 'engine spawned (pid' "$log"; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat runner-app.log
              test ! -f "$log" || cat "$log"
              exit 1
            fi
            sleep 1
          done
          cat runner-app.log
          test ! -f "$log" || cat "$log"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: spotifine-macos
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bun -e 'const v = require("./package.json").version; const tag = process.env.RELEASE_TAG.replace(/^v/, ""); if (v !== tag || require("./src-tauri/tauri.conf.json").version !== tag) throw Error(`Release tag ${tag} must match app version ${v}`)'
      - name: Build signed NSIS updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          bun tauri build
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe)
          test "${#installers[@]}" -eq 1
          test -s "${installers[0]}"
          test -s "${installers[0]}.sig"
          mkdir -p release-assets
          cp "${installers[0]}" release-assets/Spotifine-windows-x64-setup.exe
          cp "${installers[0]}.sig" release-assets/Spotifine-windows-x64-setup.exe.sig
      - uses: actions/upload-artifact@v4
        with:
          name: spotifine-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: spotifine-*
          merge-multiple: true
          path: release-assets
      - name: Publish complete signed release and latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd release-assets
          mac=Spotifine-macos-arm64.app.tar.gz
          win=Spotifine-windows-x64-setup.exe
          zip=Spotifine-macos-arm64.zip
          for file in "$mac" "$mac.sig" "$win" "$win.sig" "$zip"; do
            test -s "$file"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          version="${RELEASE_TAG#v}"
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' release.json > /dev/null
          jq -n \
            --arg version "$version" \
            --arg notes "$(jq -r '.body // ""' release.json)" \
            --arg pub_date "$(jq -r '.published_at' release.json)" \
            --arg mac_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$mac" \
            --arg win_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$win" \
            --rawfile mac_sig "$mac.sig" \
            --rawfile win_sig "$win.sig" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: ($mac_sig | rtrimstr("\n")) },
                "windows-x86_64": { url: $win_url, signature: ($win_sig | rtrimstr("\n")) }
              }
            }' > latest.json
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+([+-][0-9A-Za-z.-]+)?$")' latest.json > /dev/null
          jq -e '.pub_date != "null" and (.platforms | length == 2) and (.platforms | all(.[]; (.url | startswith("https://")) and (.signature | length > 0)))' latest.json > /dev/null
          gh release upload "$RELEASE_TAG" "$mac" "$mac.sig" "$win" "$win.sig" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
