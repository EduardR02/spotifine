name: Signed desktop release

on:
  push:
    branches: [main]
    tags: ['v*']
    # Warm dependency caches, not a second release build on every UI edit.
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/build.rs'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'bun.lock'
      - 'src-tauri/tauri*.conf.json'
      - 'src-tauri/installer-hooks.nsh'
      - '.github/tauri-ci.conf.json'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2022
    permissions:
      contents: read
    uses: ./.github/workflows/desktop.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      # Only trusted main pushes may save dependencies; tags and manual runs restore only.
      seed-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}

  publish:
    if: github.ref_type == 'tag'
    needs: desktop
    concurrency:
      group: desktop-release-promotion
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
      mac_sha256: ${{ steps.publish.outputs.mac_sha256 }}
      is_latest: ${{ steps.publish.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: spotifine-*
          merge-multiple: true
          path: release-assets
      - name: Publish complete signed release and latest.json
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          mac=Spotifine-macos-arm64.app.tar.gz
          win=Spotifine-windows-x64-setup.exe
          zip=Spotifine-macos-arm64.zip
          assets=("$mac" "$mac.sig" "$win" "$win.sig" "$zip" latest.json)
          for file in "$mac" "$mac.sig" "$win" "$win.sig" "$zip"; do
            test -s "$file"
          done
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          mac_sha256="$(sha256sum "$zip" | awk '{print $1}')"
          # Keep /releases/latest on the previous complete release throughout
          # the build and upload. Only draft assets may be replaced on retry.
          if ! gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,body,assets > release.json; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Spotifine $version" --notes-file ../RELEASE_NOTES.md
            gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,body,assets > release.json
          fi
          jq -e '.isPrerelease | not' release.json > /dev/null
          if ! jq -e '.isDraft' release.json > /dev/null; then
            # A lost response after promotion is safe to retry, but never
            # overwrite a public release or accept one with missing assets.
            for asset in "${assets[@]}"; do
              jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' release.json > /dev/null
            done
            printf 'version=%s\nmac_sha256=%s\nis_latest=false\n' "$version" "$mac_sha256" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n \
            --arg version "$version" \
            --arg notes "$(jq -r '.body // ""' release.json)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$mac" \
            --arg win_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$win" \
            --rawfile mac_sig "$mac.sig" \
            --rawfile win_sig "$win.sig" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: ($mac_sig | rtrimstr("\n")) },
                "windows-x86_64": { url: $win_url, signature: ($win_sig | rtrimstr("\n")) }
              }
            }' > latest.json
          jq -e '(.platforms | length == 2) and (.platforms | all(.[]; (.url | startswith("https://")) and (.signature | length > 0)))' latest.json > /dev/null
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          # Serialize promotions across tags. A slower/older build may
          # publish, but it cannot replace a newer update or download link.
          latest=$(gh api graphql \
            -f query='query($owner: String!, $repo: String!) { repository(owner: $owner, name: $repo) { latestRelease { tagName } } }' \
            -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
            --jq '.data.repository.latestRelease.tagName // ""')
          make_latest=true
          if [[ -n "$latest" && "$(printf '%s\n' "$latest" "$RELEASE_TAG" | sort -V | tail -n 1)" != "$RELEASE_TAG" ]]; then
            make_latest=false
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$make_latest"
          printf 'version=%s\nmac_sha256=%s\nis_latest=%s\n' "$version" "$mac_sha256" "$make_latest" >> "$GITHUB_OUTPUT"

  publish-homebrew:
    if: github.ref_type == 'tag' && needs.publish.outputs.is_latest == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap cask
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          MAC_SHA256: ${{ needs.publish.outputs.mac_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping Homebrew tap update."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/EduardR02/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks
          cat > Casks/spotifine.rb <<EOF
          cask "spotifine" do
            version "${VERSION}"
            sha256 "${MAC_SHA256}"

            url "https://github.com/EduardR02/spotifine/releases/download/v#{version}/Spotifine-macos-arm64.zip",
                verified: "github.com/EduardR02/spotifine/"
            name "Spotifine"
            desc "Lightweight Spotify desktop client"
            homepage "https://eduardr02.github.io/spotifine/"

            depends_on arch: :arm64
            depends_on macos: ">= :sonoma"

            auto_updates true

            app "Spotifine.app"

            zap trash: [
              "~/Library/Application Support/Spotifine",
              "~/Library/Caches/com.spotifine.client",
              "~/Library/Preferences/com.spotifine.client.plist",
              "~/Library/WebKit/com.spotifine.client",
            ]
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/spotifine.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update spotifine to ${VERSION}"
            git push
          fi

  publish-winget:
    if: github.ref_type == 'tag' && needs.publish.outputs.is_latest == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check Winget token
        id: check
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -n "$WINGET_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "WINGET_TOKEN secret is not set; skipping Winget update."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit Winget manifest update
        if: steps.check.outputs.configured == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: EduardR02.Spotifine
          installers-regex: '^Spotifine-windows-x64-setup\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
