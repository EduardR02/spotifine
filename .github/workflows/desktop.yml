name: Desktop build and test

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      seed-cache:
        required: true
        type: boolean
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false

defaults:
  run:
    shell: bash

env:
  RELEASE_ENGINE: target/release/PlaybackEngine${{ inputs.platform == 'windows' && '.exe' || '' }}

jobs:
  prepare:
    name: Build frontend and release engine
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun -e 'const v = require("./package.json").version; if (process.env.RELEASE_TAG !== `v${v}` || !/^\d+\.\d+\.\d+$/.test(v) || require("./src-tauri/tauri.conf.json").version !== v || Bun.TOML.parse(await Bun.file("src-tauri/Cargo.toml").text()).package.version !== v) throw Error(`Release tag ${process.env.RELEASE_TAG} must match all app versions`)'
      - uses: dtolnay/rust-toolchain@stable
      # rust-cache keys include the compiler and architecture, and ignore local
      # crate versions in manifests and Cargo.lock. Only dependencies survive.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ inputs.runner }}-release-engine-${{ hashFiles('Cargo.toml', 'vendor/*/Cargo.toml') }}
          cache-bin: false
          save-if: ${{ inputs.seed-cache }}
      - name: Build and stage this run's release inputs
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
          cargo build --locked --release -p renderer-engine --bin PlaybackEngine
          if [[ "$RUNNER_OS" == macOS ]]; then
            bash dev/sign-macos-engine.sh
          fi
          test -s build/index.html
          test -s "$RELEASE_ENGINE"
          test -x "$RELEASE_ENGINE"
          # Archive before upload: Actions' ZIP transport does not preserve executable bits.
          tar -cf desktop-inputs.tar build "$RELEASE_ENGINE"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-inputs-${{ inputs.platform }}
          path: desktop-inputs.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  test:
    name: Test native crates
    needs: prepare
    runs-on: ${{ inputs.runner }}
    env:
      # Keep the optimized test profile and its assertions; omit only debug symbols.
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ inputs.runner }}-test-${{ hashFiles('Cargo.toml', 'vendor/*/Cargo.toml') }}
          cache-bin: false
          save-if: ${{ inputs.seed-cache }}
      - uses: actions/download-artifact@v4
        with:
          name: desktop-inputs-${{ inputs.platform }}
      - name: Test shared code, playback engine, audio cache and shell
        run: |
          tar -xpf desktop-inputs.tar
          test -s build/index.html
          test -s "$RELEASE_ENGINE"
          test -x "$RELEASE_ENGINE"
          if [[ "$RUNNER_OS" == Windows ]]; then
            SPOTIFY_ENGINE_PATH=$(cygpath -am "$RELEASE_ENGINE")
          else
            SPOTIFY_ENGINE_PATH="$PWD/$RELEASE_ENGINE"
          fi
          export SPOTIFY_ENGINE_PATH
          cargo test --locked -p spotifine-common -p renderer-engine -p librespot-audio -p spotifine -- --test-threads=1

  package:
    name: Build Tauri shell and bundles
    needs: prepare
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ inputs.runner }}-release-shell-${{ hashFiles('Cargo.toml', 'vendor/*/Cargo.toml', 'bun.lock', '.github/tauri-ci.conf.json') }}
          cache-bin: false
          save-if: ${{ inputs.seed-cache }}
      - uses: actions/download-artifact@v4
        with:
          name: desktop-inputs-${{ inputs.platform }}
      - name: Build from the staged frontend and engine
        env:
          SEED_CACHE: ${{ inputs.seed-cache }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          tar -xpf desktop-inputs.tar
          test -s build/index.html
          test -s "$RELEASE_ENGINE"
          test -x "$RELEASE_ENGINE"
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --verify --strict "$RELEASE_ENGINE"
          fi
          bun install --frozen-lockfile
          flags=()
          if [[ "$SEED_CACHE" == true ]]; then
            # Compile through Tauri in both paths (features, deployment target, etc.).
            flags+=(--no-bundle)
          else
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
          fi
          bun tauri build --config .github/tauri-ci.conf.json "${flags[@]}" -- --locked
      - name: Verify and stage macOS app and updater archive
        if: ${{ !inputs.seed-cache && runner.os == 'macOS' }}
        run: |
          app=target/release/bundle/macos/Spotifine.app
          test -x "$app/Contents/MacOS/Spotifine"
          test -x "$app/Contents/Resources/PlaybackEngine"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.spotifine.client
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 14.0
          archive="$app.tar.gz"
          test -s "$archive"
          test -s "$archive.sig"
          mkdir -p archive-check
          tar -xzf "$archive" -C archive-check
          codesign --verify --deep --strict archive-check/Spotifine.app
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$app" release-assets/Spotifine-macos-arm64.zip
          cp "$archive" release-assets/Spotifine-macos-arm64.app.tar.gz
          cp "$archive.sig" release-assets/Spotifine-macos-arm64.app.tar.gz.sig
      - name: Smoke-launch the app and bundled engine
        if: ${{ !inputs.seed-cache && runner.os == 'macOS' }}
        run: |
          app=target/release/bundle/macos/Spotifine.app
          log="$HOME/Library/Application Support/Spotifine/logs/spotifine.log"
          "$app/Contents/MacOS/Spotifine" > runner-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if test -f "$log" && grep -q 'engine spawned (pid' "$log"; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat runner-app.log
              test ! -f "$log" || cat "$log"
              exit 1
            fi
            sleep 1
          done
          cat runner-app.log
          test ! -f "$log" || cat "$log"
          exit 1
      - name: Verify and stage signed NSIS updater
        if: ${{ !inputs.seed-cache && runner.os == 'Windows' }}
        run: |
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe)
          test "${#installers[@]}" -eq 1
          test -s "${installers[0]}"
          test -s "${installers[0]}.sig"
          mkdir -p release-assets
          cp "${installers[0]}" release-assets/Spotifine-windows-x64-setup.exe
          cp "${installers[0]}.sig" release-assets/Spotifine-windows-x64-setup.exe.sig
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.seed-cache }}
        with:
          name: spotifine-${{ inputs.platform }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
