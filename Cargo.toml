# Cargo workspace: the Tauri shell plus the Rust playback engine.
# `cargo build --release` at the repo root builds both.
[workspace]
resolver = "3"
members = ["engine", "src-tauri"]
exclude = ["vendor/librespot-audio", "vendor/librespot-playback"]

# FileId does not identify songs versus episodes. These pinned 0.8.0 patches
# carry the audio item's URI into each load (including preload), so only songs
# can read/write persistent audio cache. No session-wide cache toggles.
# Playback also exposes the selected playable file identity to rendered-audio
# listening reports; cached/relinked loads cannot be guessed from a queue row.
[patch.crates-io]
librespot-audio = { path = "vendor/librespot-audio" }
librespot-playback = { path = "vendor/librespot-playback" }

# Release builds are what actually get run, so pay the compile time once for a
# smaller, faster binary: cross-crate inlining, no parallel-codegen splits, and
# no symbol table shipped.
[profile.release]
lto = true
codegen-units = 1
strip = true

# The engine is DSP: one WSOLA search is hundreds of thousands of multiply-
# accumulates, and a second of audio needs dozens of them. An unoptimised build
# runs that roughly two orders of magnitude slower than the binary that ships,
# which turned `cargo test` into a minutes-long CPU storm on a laptop.
#
# Optimising the test profile changes nothing about what the tests prove:
# `debug-assertions` and `overflow-checks` default to on here exactly as they do
# in `dev`, so every assertion and every arithmetic check still fires. Only the
# arithmetic between them gets compiled properly.
[profile.test]
opt-level = 2
