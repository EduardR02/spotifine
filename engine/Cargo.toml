[package]
name = "renderer-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "PlaybackEngine"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cpal = "0.16"
futures-util = { version = "0.3", default-features = false }
http = "1"
protobuf = "3.7"
protobuf-json-mapping = "3.7"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
librespot-audio = { version = "=0.8.0", default-features = false }
librespot-core = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-protocol = { version = "=0.8.0", default-features = false }
# The OAuth authorize URL must be known before the flow runs (the UI presents
# it), so the engine drives the authorization-code + PKCE flow directly
# instead of going through librespot-oauth (which hides the URL inside
# get_access_token). Feature flags mirror librespot-oauth's so the shared
# reqwest/oauth2 dependency graphs stay unified.
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "reqwest-blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac"] }
url = "2.5"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.44", features = ["implement", "Win32_Media_Audio", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware", "block2", "dispatch2", "objc2"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
