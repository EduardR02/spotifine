[package]
name = "spotifine"
version = "0.2.0"
description = "Spotifine, Spotify without the bloat"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spotifine_lib"
# Desktop-only: `main.rs` links this as a plain Rust library. The scaffold's
# `staticlib`/`cdylib` outputs exist for mobile and FFI consumers, and cost a
# 142 MB static archive plus its link time on every build for nothing here.
crate-type = ["rlib"]

# The executable is what Task Manager, Activity Monitor and the installers
# show, so it carries the product name as written: `Spotifine.exe` and
# `Spotifine.app/Contents/MacOS/Spotifine`.
[[bin]]
name = "Spotifine"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "system-proxy", "json"] }
sha1 = "0.10"
souvlaki = "0.8"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
renderer-engine = { path = "../engine" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.44", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }
